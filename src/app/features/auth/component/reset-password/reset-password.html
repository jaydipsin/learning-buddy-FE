<app-auth-layout [heading]="isSuccess() ? 'Password updated' : 'Reset your password'"
  [description]="token && !isSuccess() ? 'Use at least eight characters for your new password.' : ''">
  <ng-template>
    @if (isSuccess()) {
      <p class="notice anim-view" role="status">{{ message() }} Returning to sign in…</p>
    } @else if (!token) {
      <p class="notice anim-view" role="alert">This link is missing its reset token. Request a new link from the sign-in screen.</p>
      <a class="btn-secondary" routerLink="/login">Back to sign in</a>
    } @else {
      <form class="flow" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        @if (message()) { <p class="notice anim-view" role="alert">{{ message() }}</p> }
        <app-auth-field [group]="resetForm" fieldId="reset-new" name="newPassword" label="New password" type="password" autocomplete="new-password" />
        <app-auth-field [group]="resetForm" fieldId="reset-confirm" name="confirmNewPassword" label="Confirm new password"
          type="password" matches="newPassword" autocomplete="new-password" />
        <button class="btn-primary btn-block" type="submit" [disabled]="isLoading() || resetStatus() !== 'VALID'" [attr.aria-busy]="isLoading()">
          {{ isLoading() ? 'Resetting password…' : 'Reset password' }}
        </button>
      </form>
    }
  </ng-template>
</app-auth-layout>
