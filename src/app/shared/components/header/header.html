<header class="sticky top-0 z-40 bg-[var(--color-bg)]/95 backdrop-blur-md border-b border-[var(--color-border)] pt-[env(safe-area-inset-top,0px)]">
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
    
    <!-- Left: Brand & Active Context -->
    <div class="flex items-center gap-6">
      <a routerLink="/student/dashboard" class="flex items-center gap-3 text-decoration-none group">
        <div class="w-8 h-8 rounded-lg bg-[var(--color-primary)] text-white flex items-center justify-center font-bold text-sm shadow-xs">
          LB
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-bold tracking-tight text-[var(--color-text-main)] group-hover:text-[var(--color-primary)] transition-colors">
            Learning Buddy
          </span>
          <span class="text-[10px] font-semibold text-[var(--color-text-muted)] uppercase tracking-wider">
            Exam Prep Platform
          </span>
        </div>
      </a>

      <!-- Divider -->
      <div class="hidden md:block h-5 w-px bg-[var(--color-border)]"></div>

      <!-- Active Course Pill -->
      <div class="hidden md:flex items-center gap-2 px-2.5 py-1 rounded-md bg-[var(--color-blue-50)] dark:bg-blue-950/40 border border-[var(--color-blue-200)] dark:border-blue-900/50 text-[var(--color-blue-700)] dark:text-blue-300 text-xs font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-[var(--color-primary)]"></span>
        <span>{{ activeCourseName }}</span>
      </div>
    </div>

    <!-- Center: Edge-Aligned Minimal Navigation (Desktop) -->
    <nav class="hidden md:flex items-center gap-1">
      <a routerLink="/student/dashboard" 
         routerLinkActive="active-tab" 
         [routerLinkActiveOptions]="{exact: true}"
         class="nav-link">
        Dashboard
      </a>
      <a routerLink="/student/mock-test" 
         routerLinkActive="active-tab" 
         class="nav-link">
        Mock Tests
      </a>
      <a routerLink="/student/chat" 
         routerLinkActive="active-tab" 
         class="nav-link flex items-center gap-1.5">
        <span>AI Buddy</span>
        <span class="badge-minimal badge-teal text-[10px] py-0 px-1.5">New</span>
      </a>
      <a (click)="comingSoon('Performance Analytics')" 
         class="nav-link cursor-pointer">
        Analytics
      </a>
    </nav>

    <!-- Right: Utility Controls -->
    <div class="flex items-center gap-3">
      <!-- Minimalist Streak Counter -->
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--color-bg-subtle)] border border-[var(--color-border)] text-[var(--color-text-main)] text-xs font-semibold"
           [title]="'Study Streak: ' + streak + ' days'">
        <svg class="w-3.5 h-3.5 text-amber-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.527.82-1.124 1.956-1.47 3.328a11.144 11.144 0 00-.28 1.488 4.962 4.962 0 01-1.353-.941c-.244-.24-.492-.51-.722-.8a1 1 0 00-1.637.28c-.44 1.055-.66 2.19-.66 3.336 0 4.142 3.358 7.5 7.5 7.5s7.5-3.358 7.5-7.5c0-2.483-1.077-4.717-2.793-6.23-.393-.347-.797-.68-1.222-1.002-.544-.412-.862-.76-.862-.76a1 1 0 00-.482-.674z" clip-rule="evenodd"/>
        </svg>
        <span class="font-mono">{{ streak }}d</span>
      </div>

      <!-- Theme Switcher -->
      <button (click)="toggleTheme()"
              class="w-8 h-8 rounded-md border border-[var(--color-border)] bg-[var(--color-surface)] hover:border-[var(--color-primary)] flex items-center justify-center transition-colors cursor-pointer text-xs text-[var(--color-text-muted)] hover:text-[var(--color-text-main)]"
              [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'">
        @if (isDarkMode) {
          <!-- Sun SVG -->
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        } @else {
          <!-- Moon SVG -->
          <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        }
      </button>

      <!-- User Profile Menu -->
      <div class="relative">
        <button (click)="toggleProfileMenu()"
                class="h-8 pl-1.5 pr-2.5 rounded-md border border-[var(--color-border)] bg-[var(--color-surface)] hover:border-[var(--color-primary)] transition-colors flex items-center gap-2 cursor-pointer">
          <app-avatar [name]="userName" size="sm" [isPremium]="isPremium"></app-avatar>
          <span class="hidden lg:inline text-xs font-medium text-[var(--color-text-main)]">{{ userName }}</span>
          <svg class="w-3 h-3 text-[var(--color-text-muted)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <!-- Profile Dropdown -->
        @if (isProfileMenuOpen) {
          <div class="absolute right-0 mt-2 w-52 rounded-lg bg-[var(--color-surface)] border border-[var(--color-border)] shadow-elevated py-1.5 z-50">
            <div class="px-3.5 py-2 border-b border-[var(--color-border)] mb-1">
              <p class="text-[11px] text-[var(--color-text-muted)]">Signed in as</p>
              <p class="text-xs font-bold text-[var(--color-text-main)] truncate">{{ userName }}</p>
            </div>
            
            <a routerLink="/student/dashboard" (click)="isProfileMenuOpen = false" class="dropdown-item">Dashboard</a>
            <a routerLink="/student/mock-test" (click)="isProfileMenuOpen = false" class="dropdown-item">Mock Tests</a>
            <a routerLink="/student/chat" (click)="isProfileMenuOpen = false" class="dropdown-item">AI Study Buddy</a>
            <a routerLink="/auth/complete-profile" (click)="isProfileMenuOpen = false" class="dropdown-item">Course Settings</a>
            
            <div class="h-px bg-[var(--color-border)] my-1"></div>
            
            <button (click)="comingSoon('Logout')" class="dropdown-item w-full text-left text-rose-600 dark:text-rose-400 bg-transparent border-0 cursor-pointer">
              Sign Out
            </button>
          </div>
        }
      </div>
    </div>

  </div>
</header>
